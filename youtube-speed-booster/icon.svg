<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Red rounded square background -->
  <rect width="128" height="128" rx="28" ry="28" fill="#FF0000"/>

  <!-- Rabbit silhouette (running, facing right) -->
  <!-- Body -->
  <ellipse cx="62" cy="82" rx="26" ry="20" fill="white"/>
  <!-- Head -->
  <ellipse cx="88" cy="68" rx="16" ry="14" fill="white"/>
  <!-- Left ear (tall, upright) -->
  <ellipse cx="80" cy="38" rx="6" ry="18" fill="white" transform="rotate(-10 80 38)"/>
  <!-- Right ear (slightly tilted back, speed effect) -->
  <ellipse cx="92" cy="35" rx="5" ry="20" fill="white" transform="rotate(15 92 35)"/>
  <!-- Inner ear left -->
  <ellipse cx="80" cy="38" rx="3" ry="13" fill="#FF6666" transform="rotate(-10 80 38)"/>
  <!-- Inner ear right -->
  <ellipse cx="92" cy="35" rx="2.5" ry="14" fill="#FF6666" transform="rotate(15 92 35)"/>
  <!-- Eye -->
  <circle cx="93" cy="64" r="3" fill="#FF0000"/>
  <!-- Nose -->
  <ellipse cx="101" cy="70" rx="3" ry="2" fill="#FFAAAA"/>
  <!-- Front legs (running forward) -->
  <ellipse cx="96" cy="96" rx="6" ry="12" fill="white" transform="rotate(-30 96 96)"/>
  <ellipse cx="84" cy="100" rx="5" ry="11" fill="white" transform="rotate(-10 84 100)"/>
  <!-- Back legs (pushing off) -->
  <ellipse cx="44" cy="92" rx="6" ry="13" fill="white" transform="rotate(30 44 92)"/>
  <ellipse cx="56" cy="98" rx="5" ry="11" fill="white" transform="rotate(10 56 98)"/>
  <!-- Tail -->
  <circle cx="38" cy="78" r="8" fill="white"/>
  <!-- Speed lines -->
  <line x1="18" y1="60" x2="38" y2="60" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="14" y1="72" x2="36" y2="72" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="20" y1="84" x2="38" y2="84" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Play triangle (YouTube style) on the body -->
  <polygon points="56,72 56,92 74,82" fill="#FF0000"/>
</svg>
