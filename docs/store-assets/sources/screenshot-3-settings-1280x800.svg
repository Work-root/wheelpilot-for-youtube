<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080708"/><stop offset="1" stop-color="#2a1317"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#ff3045"/><stop offset="1" stop-color="#ff7048"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1140" cy="95" r="280" fill="#ff3047" opacity="0.08"/>
  <image href="../../../youtube-speed-booster/icon128.png" x="68" y="55" width="88" height="88"/>
  <text x="68" y="210" fill="#ff6672" font-size="17" font-weight="700" letter-spacing="2" font-family="Segoe UI, sans-serif">НАСТРОЙТЕ ПОД СЕБЯ</text>
  <text x="68" y="266" fill="#fff" font-size="48" font-weight="800" font-family="Segoe UI, sans-serif">Скорость и жесты</text>
  <text x="68" y="320" fill="#fff" font-size="48" font-weight="800" font-family="Segoe UI, sans-serif">в одном popup</text>
  <text x="68" y="374" fill="#bca9ad" font-size="20" font-family="Segoe UI, sans-serif">Без регистрации. Без аналитики.</text>
  <g font-family="Segoe UI, sans-serif" font-size="21">
    <circle cx="82" cy="452" r="12" fill="#ff3b4d"/><text x="112" y="460" fill="#f4e9eb">Колёсные зоны и направления</text>
    <circle cx="82" cy="507" r="12" fill="#ff5b48"/><text x="112" y="515" fill="#f4e9eb">Скорость 0,1×–16× и пресеты</text>
    <circle cx="82" cy="562" r="12" fill="#ff8844"/><text x="112" y="570" fill="#f4e9eb">Приближение, кадры и повтор A–B</text>
    <circle cx="82" cy="617" r="12" fill="#ffb442"/><text x="112" y="625" fill="#f4e9eb">Скорость отдельно для каналов</text>
  </g>
  <rect x="68" y="681" width="420" height="7" rx="3.5" fill="#33262a"/>
  <rect x="68" y="681" width="310" height="7" rx="3.5" fill="url(#accent)"/>
  <g filter="url(#shadow)">
    <rect x="690" y="54" width="430" height="692" rx="28" fill="#120e0f" stroke="#4a3136" stroke-width="2"/>
    <image href="popup-actual.png" x="715" y="88" width="380" height="600" preserveAspectRatio="xMidYMid meet"/>
    <rect x="980" y="99" width="63" height="30" rx="9" fill="#1a1214" stroke="#4a383b"/>
    <text x="993" y="119" fill="#e9dcde" font-size="12" font-family="Segoe UI, sans-serif">RU</text>
    <path d="M1029 112 l4 4 4-4" fill="none" stroke="#c3b4b7" stroke-width="1.5"/>
  </g>
  <rect x="913" y="682" width="154" height="40" rx="20" fill="#ff3448"/>
  <text x="990" y="708" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="Segoe UI, sans-serif">✦ Знакомство</text>
